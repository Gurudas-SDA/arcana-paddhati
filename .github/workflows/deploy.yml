name: Deploy to GitHub Pages

# Publishes ONLY the main branch: main -> out/ -> https://gurudas-sda.github.io/arcana-paddhati/
# (production, Satkirti). The staging copy was removed on 18.10.2026 (Satkirti msg 4469
# «нет необходимости в staging»): no other branch triggers a deploy and nothing is ever
# built into out/staging/, so a `staging` branch, if someone creates one, publishes nothing.
# Every deploy replaces the whole Pages site with this one artifact.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  deployments: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

# Runner image pinned (not ubuntu-latest), so the switch of ubuntu-latest to
# Ubuntu 26 (2026-10-19) cannot change the build unannounced. Actions at the
# majors that run on Node 24; the build itself on Node 24 LTS (Next 16 needs
# >= 20.9).
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # GitHub Pages keys a deployment by commit SHA (actions/deploy-pages sends
      # GITHUB_SHA; the Pages API accepts no other version) and silently ignores
      # a second deployment of a commit it already has: run 37777322691
      # (08.10.2026) reported success but published nothing. With main only this
      # happens on a re-run / workflow_dispatch of an already deployed commit, so
      # such a run fails loudly here instead of a false green.
      - name: Commit not yet on Pages?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&sha=$GITHUB_SHA" --jq '.[].id'); do
            st=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1" --jq '.[0].state // ""')
            if [ "$st" = success ]; then
              echo "::error::Commit $GITHUB_SHA is already deployed to Pages - GitHub Pages would ignore this deployment and publish NOTHING. Push a new commit to main to redeploy."
              exit 1
            fi
          done
          echo "Commit $GITHUB_SHA not deployed yet - OK"

      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          path: main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: main/package-lock.json

      - name: Install dependencies
        working-directory: main
        run: npm ci

      - name: Build (basePath /arcana-paddhati)
        working-directory: main
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./main/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
