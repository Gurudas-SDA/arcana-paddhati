name: Deploy to GitHub Pages

# GitHub Pages takes ONE artifact per site, so every run builds BOTH branches:
#   main    -> out/          https://gurudas-sda.github.io/arcana-paddhati/          (production, Satkirti)
#   staging -> out/staging/  https://gurudas-sda.github.io/arcana-paddhati/staging/  (checks before main)
# A push to either branch redeploys both (each from its own latest commit).
# No `staging` branch, or its build not under /arcana-paddhati/staging -> only
# main is published (a warning in the run), production is never blocked by it.
on:
  push:
    branches: ["main", "staging"]
  workflow_dispatch:

permissions:
  contents: read
  deployments: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

# Runner image pinned (not ubuntu-latest), so the switch of ubuntu-latest to
# Ubuntu 26 (2026-10-19) cannot change the build unannounced. Actions at the
# majors that run on Node 24; the build itself on Node 24 LTS (Next 16 needs
# >= 20.9).
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # GitHub Pages keys a deployment by commit SHA (actions/deploy-pages sends
      # GITHUB_SHA; the Pages API accepts no other version) and silently ignores
      # a second deployment of a commit it already has: run 37777322691
      # (08.10.2026) reported success but published nothing. With two branches
      # that happens after a fast-forward (main and staging on the same commit),
      # so merges between them are always `git merge --no-ff` (README «Staging»),
      # and a run for an already deployed commit fails loudly here instead.
      - name: Commit not yet on Pages?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&sha=$GITHUB_SHA" --jq '.[].id'); do
            st=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1" --jq '.[0].state // ""')
            if [ "$st" = success ]; then
              echo "::error::Commit $GITHUB_SHA is already deployed to Pages - GitHub Pages would ignore this deployment and publish NOTHING. Merge main<->staging with --no-ff (a new commit), then push."
              exit 1
            fi
          done
          echo "Commit $GITHUB_SHA not deployed yet - OK"

      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          path: main

      - name: Is there a staging branch?
        id: staging
        working-directory: main
        run: |
          if git ls-remote --exit-code --heads origin staging >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No staging branch - publishing main only."
          fi

      - name: Checkout staging
        if: steps.staging.outputs.exists == 'true'
        uses: actions/checkout@v7
        with:
          ref: staging
          path: staging-src

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: main/package-lock.json

      - name: Install dependencies (main)
        working-directory: main
        run: npm ci

      - name: Build (main, basePath /arcana-paddhati)
        working-directory: main
        run: npm run build

      - name: Build (staging, basePath /arcana-paddhati/staging)
        if: steps.staging.outputs.exists == 'true'
        # A broken staging build must never stop the production deploy.
        continue-on-error: true
        working-directory: staging-src
        env:
          NEXT_PUBLIC_BASE_PATH: /arcana-paddhati/staging
        run: |
          npm ci
          npm run build
          # Only a build that really lives under /staging/ may be published
          # there (an old staging branch without base-path support would load
          # production assets and register a worker over production's scope).
          if grep -q '/arcana-paddhati/staging/_next/' out/index.html              && grep -q '"start_url": "/arcana-paddhati/staging/"' out/manifest.json; then
            mkdir -p ../main/out/staging
            cp -R out/. ../main/out/staging/
            echo "Staging published at /arcana-paddhati/staging/ ($(git rev-parse --short HEAD))"
          else
            echo "::warning::staging build is not under /arcana-paddhati/staging - NOT published (main only)"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./main/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
