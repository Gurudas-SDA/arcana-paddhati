name: Deploy to GitHub Pages

# GitHub Pages takes ONE artifact per site, so every run builds BOTH branches:
#   main    -> out/          https://gurudas-sda.github.io/arcana-paddhati/          (production, Satkirti)
#   staging -> out/staging/  https://gurudas-sda.github.io/arcana-paddhati/staging/  (checks before main)
# A push to either branch redeploys both (each from its own latest commit).
# No `staging` branch, or its build not under /arcana-paddhati/staging -> only
# main is published (a warning in the run), production is never blocked by it.
on:
  push:
    branches: ["main", "staging"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

# Runner image pinned (not ubuntu-latest), so the switch of ubuntu-latest to
# Ubuntu 26 (2026-10-19) cannot change the build unannounced. Actions at the
# majors that run on Node 24; the build itself on Node 24 LTS (Next 16 needs
# >= 20.9).
jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          path: main

      - name: Is there a staging branch?
        id: staging
        working-directory: main
        run: |
          if git ls-remote --exit-code --heads origin staging >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No staging branch - publishing main only."
          fi

      - name: Checkout staging
        if: steps.staging.outputs.exists == 'true'
        uses: actions/checkout@v7
        with:
          ref: staging
          path: staging-src

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: main/package-lock.json

      - name: Install dependencies (main)
        working-directory: main
        run: npm ci

      - name: Build (main, basePath /arcana-paddhati)
        working-directory: main
        run: npm run build

      - name: Build (staging, basePath /arcana-paddhati/staging)
        if: steps.staging.outputs.exists == 'true'
        # A broken staging build must never stop the production deploy.
        continue-on-error: true
        working-directory: staging-src
        env:
          NEXT_PUBLIC_BASE_PATH: /arcana-paddhati/staging
        run: |
          npm ci
          npm run build
          # Only a build that really lives under /staging/ may be published
          # there (an old staging branch without base-path support would load
          # production assets and register a worker over production's scope).
          if grep -q '/arcana-paddhati/staging/_next/' out/index.html              && grep -q '"start_url": "/arcana-paddhati/staging/"' out/manifest.json; then
            mkdir -p ../main/out/staging
            cp -R out/. ../main/out/staging/
            echo "Staging published at /arcana-paddhati/staging/ ($(git rev-parse --short HEAD))"
          else
            echo "::warning::staging build is not under /arcana-paddhati/staging - NOT published (main only)"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./main/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      # Not actions/deploy-pages: it sends GITHUB_SHA as the Pages build version,
      # and Pages ignores a second deployment with a version it already has. With
      # two branches the same commit is deployed twice (push staging X, then
      # fast-forward main to X) - the second artifact (with the other branch's
      # newer build) was silently NOT published (run 37777322691, 08.10.2026).
      # Same API calls as deploy-pages, with a version unique per run.
      - name: Deploy to GitHub Pages
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          BUILD_VERSION: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          OIDC=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          echo "::add-mask::$OIDC"
          RESP=$(jq -n --arg a "$ARTIFACT_ID" --arg v "$BUILD_VERSION" --arg o "$OIDC"                    '{artifact_id: ($a|tonumber), pages_build_version: $v, oidc_token: $o}'                  | gh api -X POST "repos/$GITHUB_REPOSITORY/pages/deployments" --input -)
          ID=$(echo "$RESP" | jq -r '(.id // empty) | tostring')
          [ -n "$ID" ] || ID=$(echo "$RESP" | jq -r '.status_url | split("/") | last')
          echo "page_url=$(echo "$RESP" | jq -r .page_url)" >> "$GITHUB_OUTPUT"
          echo "Pages deployment $ID (build version $BUILD_VERSION)"
          for i in $(seq 1 120); do
            S=$(gh api "repos/$GITHUB_REPOSITORY/pages/deployments/$ID" --jq .status || echo unknown)
            echo "status: $S"
            case "$S" in
              succeed) exit 0 ;;
              *fail*|*error*|*cancel*|*lost*) echo "::error::Pages deployment $S"; exit 1 ;;
            esac
            sleep 5
          done
          echo "::error::Pages deployment did not finish in 10 min"; exit 1
